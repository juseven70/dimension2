- name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          # 1. コンパイルするファイル名
          root_file: root.tex
          
          # 2. 作業するフォルダ名（あなたの実際のフォルダ名に変えてください）
          working_directory: 20260725中間発表①
          
          compiler: lualatex
          args: "-file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Poster-PDF-${{ github.ref_name }}
          # 3. PDFが作成される場所もフォルダ名を含めて指定
          path: 20260725中間発表①/root.pdf
name: Compile LaTeX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: root.tex 
          compiler: lualatex
          latexmk_use_lualatex: true
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: poster-pdf
          path: poster.pdf